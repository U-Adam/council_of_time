<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">The Council of Time witness seal</title>
  <desc id="desc">A simple brass seal: an observing eye centered on a compass star, with four precise nodes.</desc>

  <rect width="256" height="256" rx="128" fill="#11100e"/>

  <!-- Seal: continuity, gravity, authority. -->
  <circle cx="128" cy="128" r="106" fill="none" stroke="#b99249" stroke-width="7"/>

  <!-- Four nodes: modern systems and measured inquiry. -->
  <g fill="#11100e" stroke="#d4a84f" stroke-width="4">
    <circle cx="128" cy="22" r="7"/>
    <circle cx="234" cy="128" r="7"/>
    <circle cx="128" cy="234" r="7"/>
    <circle cx="22" cy="128" r="7"/>
  </g>

  <!-- Witness: human life remains at the center. -->
  <path d="M50 128C72 94 101 80 128 80s56 14 78 48c-22 34-51 48-78 48s-56-14-78-48Z"
        fill="none" stroke="#efe6d8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inquiry: orientation without pretending to certainty. -->
  <circle cx="128" cy="128" r="27" fill="#11100e" stroke="#b99249" stroke-width="5"/>
  <path d="M128 96l8 24 24 8-24 8-8 24-8-24-24-8 24-8 8-24Z" fill="#d4a84f"/>
  <circle cx="128" cy="128" r="6" fill="#efe6d8"/>
</svg>
