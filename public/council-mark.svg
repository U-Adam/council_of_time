<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">The Council of Time witness seal</title>
  <desc id="desc">A restrained gold seal combining an ancient circular instrument, a witnessing eye, and precise modern nodes.</desc>

  <rect width="256" height="256" rx="128" fill="#11100e"/>

  <!-- Authority / continuity: a seal and an instrument, not a coat of arms. -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="#b99249" stroke-width="6"/>
  <circle cx="128" cy="128" r="91" fill="none" stroke="#b99249" stroke-opacity=".46" stroke-width="2"/>

  <!-- Four measured gates: ancient geometry with modern precision. -->
  <g fill="#11100e" stroke="#d4a84f" stroke-width="4">
    <circle cx="128" cy="20" r="7"/>
    <circle cx="236" cy="128" r="7"/>
    <circle cx="128" cy="236" r="7"/>
    <circle cx="20" cy="128" r="7"/>
  </g>
  <g stroke="#b99249" stroke-width="3" stroke-linecap="round">
    <path d="M128 28v20M208 128h20M128 208v20M28 128h20"/>
  </g>

  <!-- Modern network: sparse, deliberate, subordinate to the human symbol. -->
  <g fill="#d4a84f">
    <circle cx="75" cy="75" r="3.5"/>
    <circle cx="181" cy="75" r="3.5"/>
    <circle cx="181" cy="181" r="3.5"/>
    <circle cx="75" cy="181" r="3.5"/>
  </g>
  <g fill="none" stroke="#b99249" stroke-opacity=".58" stroke-width="2">
    <path d="M79 79l15 15M177 79l-15 15M177 177l-15-15M79 177l15-15"/>
  </g>

  <!-- Witness: the eye is the human center of the system. -->
  <path d="M52 128C72 96 100 80 128 80s56 16 76 48c-20 32-48 48-76 48s-56-16-76-48Z"
        fill="none" stroke="#efe6d8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inquiry: a compass/star inside the pupil, joining observation to judgment. -->
  <circle cx="128" cy="128" r="25" fill="#11100e" stroke="#d4a84f" stroke-width="5"/>
  <path d="M128 99l7 22 22 7-22 7-7 22-7-22-22-7 22-7 7-22Z" fill="#d4a84f"/>
  <circle cx="128" cy="128" r="6" fill="#efe6d8"/>
</svg>
