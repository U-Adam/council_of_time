    <meta name="theme-color" content="#f2ede4" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A serious table for difficult questions. The goal is clearer thinking, not consensus." />

    <meta name="format-detection" content="telephone=no" />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem("council-theme");
          const theme = stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
